# PostgreSQL 16 for local development and tests.
# The ERP itself is run from the virtualenv, not from a container, so that
# module code is edited and tested in place.
services:
  postgres:
    image: postgres:16
    container_name: capital-nutrition-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tryton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tryton}
      POSTGRES_DB: ${POSTGRES_DB:-capital_nutrition}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tryton}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
