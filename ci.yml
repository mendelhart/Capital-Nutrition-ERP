name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tryton
          POSTGRES_PASSWORD: tryton
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tryton"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check modules scripts tests migration/src migration/tests

      - name: Link modules
        run: .venv/bin/python scripts/link_modules.py

      - name: Test against PostgreSQL 16
        env:
          TRYTOND_DATABASE_URI: postgresql://tryton:tryton@127.0.0.1:5432/
          DB_NAME: test_capital_nutrition
        run: .venv/bin/python -m pytest tests modules/capital_nutrition_base/tests -v

      - name: Migration toolkit tests
        working-directory: migration
        run: ../.venv/bin/python -m pytest -q
