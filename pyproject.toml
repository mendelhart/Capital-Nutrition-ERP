[project]
name = "capnut-migration"
version = "0.1.0"
description = "Odoo -> Tryton migration toolkit for Capital Nutrition ERP (spec 13_MIGRATION.md)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
capnut-migrate = "capnut_migration.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
